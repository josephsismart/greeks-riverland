<style>

:root{--navy:#1b365d;--ink:#24323f;--muted:#5f5b53;--gold:#c9a44c;--gold2:#e2c48e;--cream:#f6f1e6;--sky:#eaf1f8;--line:#e3ddd0}

.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.78rem;font-weight:700;color:#9a7a35}

#full{padding:.5rem .6rem .6rem}
.top{display:none}

.top .back{display:inline-flex;align-items:center;gap:.4rem;color:#fff;background:rgba(255,255,255,.14);border:.1rem solid rgba(255,255,255,.55);border-radius:999px;padding:.55rem 1.1rem;text-decoration:none;font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit}

.contact .err{color:#a3271b;font-weight:700;margin-top:.6rem}

.card .go{margin-top:auto;padding-top:.4rem;font-weight:700;color:#8a6a2c;font-size:.98rem}
a.card:hover,a.card:focus{box-shadow:0 .5rem 1.2rem rgba(27,54,93,.15);outline:none;border-color:var(--navy)}

}

  var f = (P.facts || []).slice(0, 4);
  if (!f.length) f = [['From', origin], ['In the Riverland', years], ['Arrived in Australia', F.arrived || ''], ['Lived before the Riverland', F.before || '']];
  return '<div class="facts">' + f.map(function (x) { return '<div class="fact"><div class="k">' + esc(x[0]) + '</div><div class="v' + (x[1] ? '' : ' no') + '">' + esc(x[1] || 'Not yet recorded') + '</div></div>'; }).join('') + '</div>';
}
function hero(page) {
  return '<div class="hero">' + stage() + '<div class="info"><div class="eyebrow">Family story</div><h1>' + esc(name) + ' family</h1>' +
    (where ? '<div class="where">' + PIN + esc(where) + '</div>' : '') +
    '<div class="chips">' + (years ? '<span class="chip">In the Riverland ' + esc(years) + '</span>' : '') + (origin ? '<span class="chip g">From ' + esc(origin) + '</span>' : '') + '</div>' +
    facts() +
    '<div class="acts">' + (page ? '' : '<a class="btn navy" href="' + esc(selfUrl) + '">Read the full story &rarr;</a>') + '<a class="btn ' + (page ? 'navy' : 'line') + '" href="upload.html">Share a photo</a>' + (page ? '<a class="btn line" href="' + esc(addUrl) + '">Add to this story</a>' : '') + '</div></div></div>';
}
function fullPage() {
  var h = pageTop('', (function () { var t = townObjs[0]; return t && t.path ? SITE + String(t.path).replace(/^\//, '') : SITE + 'families'; })());
  h += hero(true);
  h += '<div class="sec"><h2>The ' + esc(name) + ' family story</h2>' +
    (storyText ? '<div class="story">' + esc(storyText) + '</div>'
               : '<div class="story todo"><span>The story has not been written yet. Do you know it?</span><a class="btn navy" href="' + esc(addUrl) + '">Add the story</a></div>') + '</div>';
  h += '<div class="sec"><h2>Family members</h2>' + (members.length ? '<div class="members">' + members.map(function (m) { return '<div class="member"><div class="mono">' + esc(m.charAt(0).toUpperCase()) + '</div><div>' + esc(m) + '</div></div>'; }).join('') + '</div>'
                                                      : '<div class="story todo"><span>Not yet recorded.</span><a class="btn navy" href="' + esc(addUrl) + '">Add what you know</a></div>') + '</div>';
  if (towns.length) h += '<div class="sec"><h2>Riverland towns</h2><div class="chips" style="margin:0">' + townObjs.map(function (t) { return '<a class="chip" style="text-decoration:none" href="town.html?t=' + encodeURIComponent(t.name) + '">' + esc(t.name) + ' &rarr;</a>'; }).join('') + '</div></div>';
  h += '<div class="sec"><h2>Photographs <small>' + (photos.length ? 'Tap a photo to see it bigger' : '') + '</small></h2>' +
    (photos.length ? '<div class="gal">' + photos.map(function (p, i) { return '<button class="ph" data-i="' + i + '" style="background-image:url(\'' + img(p.id, 700) + '\')"><div class="cap">' + esc(capOf(p)).slice(0, 110) + '</div></button>'; }).join('') + '</div>'
                   : '<div class="story todo"><span>No photographs yet. Do you have one of the ' + esc(name) + ' family?</span><a class="btn navy" href="upload.html">Share a photo</a></div>') + '</div>';
  h += '<div class="contact" id="contact"><h3>Would you like to contact the ' + esc(name) + ' family?</h3>' +
       '<p>Send a message to the project team. We pass it on to the family. Their contact details are never shown on the website.</p>' +
       '<button class="btn navy" type="button" id="cOpen">Ask to contact this family</button>' +
       '<form id="cForm"><label for="cName">Your name</label><input id="cName" type="text" autocomplete="name">' +
       '<label for="cEmail">Your email</label><input id="cEmail" type="email" autocomplete="email">' +
       '<label for="cPhone">Your phone <small>(optional)</small></label><input id="cPhone" type="tel" autocomplete="tel">' +
       '<label for="cMsg">Your message</label><textarea id="cMsg" placeholder="For example: I think my grandfather worked with your father in the 1960s and I would love to hear from you."></textarea>' +
       '<div class="err" id="cErr"></div><button class="btn navy" type="submit" id="cSend" style="margin-top:1rem;width:100%">Send my message</button></form></div>';
  h += '<div class="share"><div><h3>Do you know more about the ' + esc(name) + ' family?</h3><p>Add to the story, or send old photographs. Everything is checked before it goes on the website.</p></div>' +
       '<div class="btns"><a class="btn navy" href="' + esc(addUrl) + '">Add to this story</a><a class="btn line" href="upload.html">Send photos</a></div></div>';
  return h;
}
function card(title, text, href) {
  if (text) return '<a class="card" href="' + esc(selfUrl) + '"><h4>' + esc(title) + '</h4><p>' + esc(text) + '</p><div class="go">Read more &rarr;</div></a>';
  return '<a class="card todo" href="' + esc(addUrl) + '"><h4>' + esc(title) + '</h4><p>Not yet recorded.</p><div class="go">Add what you know &rarr;</div></a>';
}
function wide() {
  return hero(false) + '<div class="cards">' + card('Family story', storyText) + card('Family members', members.join('\n')) + card('Photographs', photos.length ? photos.length + (photos.length === 1 ? ' photograph' : ' photographs') + ' shared' : '') + card('Riverland towns', towns.join(', ')) + '</div>';
}
function mini() {
  return '<div class="veil"></div><div class="in"><h2>' + esc(name) + ' family</h2>' +
    '<div class="s">' + esc([where, years].filter(Boolean).join(' · ')) + '</div>' +
    '<a href="' + esc(selfUrl) + '">' + (photos.length ? 'Read the story &amp; see photos' : 'Read the family story') + ' &rsaquo;</a></div>';
}
var box = document.getElementById('box'), cur = 0;
function openBig(i) {
  cur = (i + photos.length) % photos.length; var p = photos[cur];
  document.getElementById('big').src = img(p.id, 1600);
  document.getElementById('txt').innerHTML = '<b>' + esc(p.people || name + ' family') + '</b>' + ([p.year, p.place].filter(Boolean).length ? '<div class="m">' + esc([p.year, p.place].filter(Boolean).join(' · ')) + '</div>' : '') + (p.about ? '<div>' + esc(p.about) + '</div>' : '');
  box.classList.add('on');
}
document.addEventListener('click', function (e) { var c = e.target.closest && e.target.closest('button.ph'); if (c) openBig(+c.dataset.i); });
document.getElementById('x').onclick = function () { box.classList.remove('on'); };
document.getElementById('bp').onclick = function () { openBig(cur - 1); };
document.getElementById('bn').onclick = function () { openBig(cur + 1); };
box.addEventListener('click', function (e) { if (e.target === box) box.classList.remove('on'); });
document.addEventListener('keydown', function (e) { if (!box.classList.contains('on')) return; if (e.key === 'Escape') box.classList.remove('on'); if (e.key === 'ArrowLeft') openBig(cur - 1); if (e.key === 'ArrowRight') openBig(cur + 1); });
var timer = null;
window.render = function () {
  document.title = name + ' family — Greeks of the Riverland';
  clearInterval(timer);
  var m = document.getElementById('mini'), f = document.getElementById('full');
  if (MODE === 'compact') {
    f.innerHTML = ''; m.innerHTML = mini();
    m.style.backgroundImage = 'url(\'' + (photos.length ? img(photos[0].id, 900) : ARCH) + '\')';
    m.classList.toggle('nophoto', !photos.length);
    return;
  }
  m.innerHTML = ''; f.innerHTML = MODE === 'page' ? fullPage() : wide();
  var co = document.getElementById('cOpen');
  if (co) {
    co.onclick = function () { document.getElementById('contact').classList.add('open'); co.style.display = 'none'; document.getElementById('cName').focus(); };
    document.getElementById('cForm').onsubmit = function (e) {
      e.preventDefault();
      var g = function (id) { return document.getElementById(id).value.trim(); }, err = document.getElementById('cErr'), btn = document.getElementById('cSend');
      err.textContent = '';
      if (!g('cName')) { err.textContent = 'Please type your name.'; return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(g('cEmail'))) { err.textContent = 'Please type your email address.'; return; }
      if (!g('cMsg')) { err.textContent = 'Please write a short message.'; return; }
      btn.disabled = true; btn.textContent = 'Sending…';
      fetch(API, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'contactFamily', args: [{ name: g('cName'), email: g('cEmail'), phone: g('cPhone'), message: g('cMsg'), family: name }] }) })
        .then(function (r) { return r.json(); }).then(function (j) {
          if (!j.ok) throw new Error(j.error);
          document.getElementById('cForm').outerHTML = '<div class="ok">&#10003; Thank you, your message has been sent to the project team. They will pass it on to the ' + esc(name) + ' family.</div>';
        }).catch(function (x) { err.textContent = 'Sorry, that did not send. ' + x.message; btn.disabled = false; btn.textContent = 'Send my message'; });
    };
  }
  if (photos.length) {
    var c = 0, sl = f.querySelectorAll('.sl');
    var go = function (n) {
      sl[c].classList.remove('on'); c = (n + sl.length) % sl.length; sl[c].classList.add('on');
      document.getElementById('cap').innerHTML = '<b>' + esc(name) + ' family</b>' + esc(capOf(photos[c]));
      var ct = document.getElementById('ctr'); if (ct) ct.textContent = (c + 1) + ' of ' + sl.length;
    };
    var start = function () { clearInterval(timer); if (sl.length > 1) timer = setInterval(function () { go(c + 1); }, 6000); };
    go(0); start();
    if (sl.length > 1) { document.getElementById('prev').onclick = function () { go(c - 1); start(); }; document.getElementById('next').onclick = function () { go(c + 1); start(); }; }
  }
};
render();
}
load(null, main);
</script></body></html>
