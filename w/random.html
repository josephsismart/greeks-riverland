<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>From the Archive — Greeks of the Riverland</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<base target="_blank">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Home page "From the Archive": three photographs picked at random on every visit (Nick's change list #10).
   The pool is the archive photographs plus every shared photo marked Published in the Sheet. */
*{box-sizing:border-box}
html{font-size:clamp(12px,1.3vw,16px)}
html,body{margin:0;padding:0;background:transparent;font-family:Lora,Georgia,serif;color:#24323f}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem;padding:.2rem}
.c{display:block;text-decoration:none;color:inherit}
.ph{aspect-ratio:5/4;border-radius:.3rem;background:#efe9dc center/cover no-repeat;box-shadow:0 1px 6px rgba(0,0,0,.12);transition:opacity .4s}
.cap{text-align:center;margin-top:.55rem;line-height:1.35}
.t{font:700 1.05rem/1.3 'Libre Baskerville',Georgia,serif;color:#1b365d}
.s{font-size:.88rem;color:#5f5b53;margin-top:.1rem}
.bar{display:flex;justify-content:center;gap:1.4rem;margin-top:.7rem;font-size:.95rem}
.bar a,.bar button{color:#1b365d;background:none;border:0;font:600 .95rem Lora,Georgia,serif;cursor:pointer;text-decoration:none;padding:.2rem}
.bar a:hover,.bar button:hover{text-decoration:underline}
@media(max-width:520px){.row{gap:.5rem}.t{font-size:.85rem}.s{display:none}}
</style></head><body>
<script>
var API = "https://script.google.com/macros/s/AKfycbzhLYzjtKO_nrwsk3J_qXKdL0ngMO3_I6rHPRe4lxHibzdpIAncmMio2-mH4MjWIkdaGg/exec";
function load(prep, main) {
  var ld = document.createElement('div');
  ld.textContent = 'Loading…';
  ld.style.cssText = 'position:fixed;right:12px;bottom:8px;z-index:9999;font:italic 14px Lora,Georgia,serif;color:#5f5b53';
  setTimeout(function () { if (!ld.done) document.body.appendChild(ld); }, 400);
  // Two sources, fetched together: data.json on GitHub Pages (fast, refreshed every few hours) and the
  // Apps Script web app (live from the Sheet, a little slower). The live copy is used when it answers within
  // a couple of seconds, so a family or photo marked Published shows straight away; otherwise data.json.
  var used = false, cached = null, live = null, timer = null;
  function use(d) {
    if (used) return; used = true; clearTimeout(timer);
    ld.done = true; if (ld.parentNode) ld.remove();
    main(prep ? prep(d) : d);
  }
  function getJson(src) {
    return fetch(src, { credentials: 'omit' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  getJson(API + '?page=data').then(function (d) { live = d; use(d); }).catch(function () { live = false; if (cached) use(cached); });
  getJson('data.json?v=' + Math.floor(Date.now() / 300000)).then(function (d) {
    cached = d;
    if (live === false) use(d); else timer = setTimeout(function () { use(d); }, 2500);
  }).catch(function () { if (live === false) fail(); else timer = setTimeout(function () { if (!used) { if (live) use(live); else fail(); } }, 9000); });
  function fail() {
    if (used) return; used = true;
    ld.done = true; if (ld.parentNode) ld.remove();
    var p = document.createElement('p');
    p.style.cssText = 'font:16px Lora,Georgia,serif;color:#5f5b53;padding:12px';
    p.innerHTML = 'Sorry, this could not be loaded just now. <a href="" target="_self" onclick="location.reload();return false">Try again</a>.';
    document.body.appendChild(p);
  }
}
</script>

<div class="row" id="row"></div>
<div class="bar"><button id="more" type="button">&#8635; Show other photos</button><a href="https://sites.google.com/view/greeksoftheriverland/stories-photos">View all photos &rarr;</a></div>
<script>
function main(DATA){
var ARCHIVE = [{"src":"../public/m/intro-1950s.jpg","title":"Greek families of the Riverland"},{"src":"../public/m/arch-family-community.jpg","title":"Family & Community"},{"src":"../public/m/arch-work-everyday.jpg","title":"Work & Everyday Life"},{"src":"../public/m/arch-school-sporting.jpg","title":"School & Sporting Life"}];
var esc = function (s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var pool = ARCHIVE.map(function (a) { return { src: a.src, t: a.title, s: a.sub || '' }; }).concat((DATA.photos || []).map(function (p) {
  return { src: 'https://lh3.googleusercontent.com/d/' + p.id + '=w800', t: 'The ' + p.family + ' family',
    s: [p.people, p.year, p.place || p.town].filter(Boolean).join(' · ') };
}));
var last = [];
function pick() {
  var fresh = pool.filter(function (p) { return last.indexOf(p) < 0; });
  var src = fresh.length >= 3 ? fresh : pool.slice();
  for (var i = src.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = src[i]; src[i] = src[j]; src[j] = t; }
  last = src.slice(0, 3);
  document.getElementById('row').innerHTML = last.map(function (p) {
    return '<div class="c"><div class="ph" style="background-image:url(\'' + p.src + '\')"></div><div class="cap"><div class="t">' + esc(p.t) + '</div>' +
      (p.s ? '<div class="s">' + esc(p.s) + '</div>' : '') + '</div></div>';
  }).join('');
}
pick();
document.getElementById('more').onclick = pick;
if (pool.length <= 3) document.getElementById('more').style.display = 'none';
}
load(null, main);
</script></body></html>
