<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>From the Archive — Greeks of the Riverland</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<base target="_blank">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Home page "From the Archive": three photographs picked at random on every visit (Nick's change list #10).
   The pool is the archive photographs plus every shared photo marked Published in the Sheet.
   Sized from the frame width (see _frame.js); on phones the three photos fill the short frame. */
:root{--navy:#1b365d;--gold2:#e2c48e}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;font-family:Lora,Georgia,serif;color:#24323f}
html.page{font-size:17px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;padding:.3rem .5rem;height:19.5rem}
html.compact .row{gap:.35rem;padding:.15rem;height:calc(100vh - 2.3rem)}
.c{position:relative;display:block;border-radius:1rem;overflow:hidden;background:#efe9dc center/cover no-repeat;text-decoration:none;color:#fff;
 box-shadow:0 .3rem 1rem rgba(0,0,0,.14);transition:transform .2s,box-shadow .2s}
.c:hover,.c:focus{transform:translateY(-.15rem);box-shadow:0 .7rem 1.6rem rgba(0,0,0,.22);outline:none}
html.compact .c{border-radius:.55rem}
.cap{position:absolute;left:0;right:0;bottom:0;padding:2.2rem 1rem .9rem;background:linear-gradient(transparent,rgba(8,16,28,.85))}
.t{font:700 1.2rem/1.25 'Libre Baskerville',Georgia,serif}
.s{font-size:.95rem;color:#e6e0d2;margin-top:.2rem;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
html.compact .cap{padding:1.2rem .4rem .35rem}
html.compact .t{font-size:.78rem;line-height:1.2}
html.compact .s{display:none}
.bar{display:flex;justify-content:center;gap:1rem;margin-top:1.1rem}
.bar a,.bar button{display:inline-flex;align-items:center;gap:.4rem;border-radius:999px;padding:.75rem 1.4rem;font:700 1.02rem Lora,Georgia,serif;cursor:pointer;text-decoration:none}
.bar button{background:#fff;color:var(--navy);border:.12rem solid var(--navy)}
.bar a{background:var(--navy);color:#fff;border:.12rem solid var(--navy)}
html.compact .bar{margin-top:.3rem;gap:.4rem}
html.compact .bar a,html.compact .bar button{padding:.3rem .8rem;font-size:.85rem}
</style></head><body>
<script>
var API = "https://script.google.com/macros/s/AKfycbzhLYzjtKO_nrwsk3J_qXKdL0ngMO3_I6rHPRe4lxHibzdpIAncmMio2-mH4MjWIkdaGg/exec";
function load(prep, main) {
  var ld = document.createElement('div');
  ld.textContent = 'Loading…';
  ld.style.cssText = 'position:fixed;right:12px;bottom:8px;z-index:9999;font:italic 14px Lora,Georgia,serif;color:#5f5b53';
  setTimeout(function () { if (!ld.done) document.body.appendChild(ld); }, 400);
  // Two sources, fetched together: data.json on GitHub Pages (fast, refreshed every few hours) and the
  // Apps Script web app (live from the Sheet, a little slower). The live copy is used when it answers within
  // a couple of seconds, so a family or photo marked Published shows straight away; otherwise data.json.
  var used = false, cached = null, live = null, timer = null;
  function use(d) {
    if (used) return; used = true; clearTimeout(timer);
    ld.done = true; if (ld.parentNode) ld.remove();
    main(prep ? prep(d) : d);
  }
  function getJson(src) {
    return fetch(src, { credentials: 'omit' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  getJson(API + '?page=data').then(function (d) { live = d; use(d); }).catch(function () { live = false; if (cached) use(cached); });
  getJson('data.json?v=' + Math.floor(Date.now() / 300000)).then(function (d) {
    cached = d;
    if (live === false) use(d); else timer = setTimeout(function () { use(d); }, 6000);
  }).catch(function () { if (live === false) fail(); else timer = setTimeout(function () { if (!used) { if (live) use(live); else fail(); } }, 9000); });
  function fail() {
    if (used) return; used = true;
    ld.done = true; if (ld.parentNode) ld.remove();
    var p = document.createElement('p');
    p.style.cssText = 'font:16px Lora,Georgia,serif;color:#5f5b53;padding:12px';
    p.innerHTML = 'Sorry, this could not be loaded just now. <a href="" target="_self" onclick="location.reload();return false">Try again</a>.';
    document.body.appendChild(p);
  }
}
</script>

<div class="row" id="row"></div>
<div class="bar"><button id="more" type="button">&#8635; Show other photos</button><a href="stories.html">See all photos &rarr;</a></div>
<script>
/* Shared by the page widgets (town, family profile).
   Google Sites keeps an embed's height in proportion to its width (a phone gets a much shorter frame),
   so inside Sites everything is sized from the frame width:
     wide    framed, 860px or wider: the whole design scales with the width (1rem = width / 72)
     compact framed, narrower (phones): a short summary card with big buttons that open the full page
     page    opened on its own (new tab): an ordinary responsive page with a header and a back link */
var FRAMED = (function () { try { return window.top !== window; } catch (e) { return true; } })();
function frameMode() {
  var W = window.innerWidth, root = document.documentElement, mode = !FRAMED ? 'page' : (W < 860 ? 'compact' : 'wide');
  root.classList.remove('page', 'compact', 'wide'); root.classList.add(mode);
  root.style.fontSize = mode === 'wide' ? (W / 72) + 'px' : mode === 'compact' ? Math.min(W / 24, 22) + 'px' : '';
  var b = document.querySelector('base'); if (b) b.target = FRAMED ? '_blank' : '_self';
  return mode;
}
var MODE = frameMode();
var lastW = window.innerWidth;
window.addEventListener('resize', function () {
  if (Math.abs(window.innerWidth - lastW) < 2) return;
  lastW = window.innerWidth;
  var m = MODE; MODE = frameMode(); if (m !== MODE && window.render) window.render();
});
var norm = function (s) { return String(s || '').toLowerCase().replace(/[^a-z]/g, ''); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var img = function (id, w) { return 'https://lh3.googleusercontent.com/d/' + id + '=w' + (w || 800); };

function main(DATA){
var ALL = String(DATA.site || '').replace(/\/?$/, '/') + 'stories-photos';
document.querySelector('.bar a').href = ALL;
var ARCHIVE = [{"src":"../public/m/intro-1950s.jpg","title":"Greek families of the Riverland"},{"src":"../public/m/arch-family-community.jpg","title":"Family & Community"},{"src":"../public/m/arch-work-everyday.jpg","title":"Work & Everyday Life"},{"src":"../public/m/arch-school-sporting.jpg","title":"School & Sporting Life"}];
var pool = ARCHIVE.map(function (a) { return { src: a.src, t: a.title, s: a.sub || '' }; }).concat((DATA.photos || []).map(function (p) {
  return { src: img(p.id, 800), t: 'The ' + p.family + ' family', s: [p.people, p.year, p.place || p.town].filter(Boolean).join(' · ') };
}));
var last = [];
function pick() {
  var fresh = pool.filter(function (p) { return last.indexOf(p) < 0; });
  var src = fresh.length >= 3 ? fresh : pool.slice();
  for (var i = src.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = src[i]; src[i] = src[j]; src[j] = t; }
  last = src.slice(0, 3);
  document.getElementById('row').innerHTML = last.map(function (p) {
    return '<a class="c" href="' + ALL + '" style="background-image:url(\'' + p.src + '\')"><div class="cap"><div class="t">' + esc(p.t) + '</div>' +
      (p.s ? '<div class="s">' + esc(p.s) + '</div>' : '') + '</div></a>';
  }).join('');
}
pick();
document.getElementById('more').onclick = pick;
if (pool.length <= 3) document.getElementById('more').style.display = 'none';
}
load(null, main);
</script></body></html>
