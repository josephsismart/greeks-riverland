<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Stories & Photos — Greeks of the Riverland</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<base target="_blank">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Stories & Photos page body: shared photographs (tap for a big view with the description), the three
   archive themes, and a "share yours" band. Same look as the town and family pages (see _frame.js). */
:root{--navy:#1b365d;--ink:#24323f;--muted:#5f5b53;--gold:#c9a44c;--gold2:#e2c48e;--cream:#f6f1e6;--sky:#eaf1f8;--line:#e3ddd0}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;font-family:Lora,Georgia,serif;color:var(--ink)}
html.page{font-size:18px}html.page body{background:#fbf8f1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;text-decoration:none;font-weight:700;border-radius:.75rem;padding:.85rem 1.4rem;font-size:1.05rem;line-height:1.2;transition:transform .15s,box-shadow .15s;cursor:pointer;border:0;font-family:inherit}
.btn:hover,.btn:focus{transform:translateY(-.08rem);box-shadow:0 .4rem 1rem rgba(27,54,93,.25);outline:none}
.btn.navy{background:var(--navy);color:#fff}
.btn.line{background:#fff;color:var(--navy);border:.12rem solid var(--navy)}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.78rem;font-weight:700;color:#9a7a35}

#full{padding:.5rem .6rem .6rem}
.top{display:none}
html.page .top{display:block;background:var(--navy);color:#fff;text-align:center;padding:1.4rem 1rem 1.6rem;margin:0 0 1.6rem}
.top .site{font:700 1rem 'Libre Baskerville',Georgia,serif;color:var(--gold2);text-decoration:none}
.top h1{font:700 2.4rem/1.15 'Libre Baskerville',Georgia,serif;margin:.5rem 0 .8rem}
.top .back{display:inline-block;color:#fff;background:rgba(255,255,255,.12);border:.1rem solid rgba(255,255,255,.6);border-radius:999px;padding:.55rem 1.2rem;text-decoration:none;font:700 1rem Lora,Georgia,serif;cursor:pointer}
html.page #full{max-width:72rem;margin:0 auto;padding:0 1rem 2rem}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.1rem}
.head h2{margin:.2rem 0 0;font:700 2.1rem/1.15 'Libre Baskerville',Georgia,serif;color:var(--navy)}
.head p{margin:.35rem 0 0;color:var(--muted);font-size:1.05rem}
.head .r{display:flex;align-items:center;gap:.8rem;flex:none}
.count{background:var(--sky);color:var(--navy);border-radius:999px;padding:.55rem 1.1rem;font-weight:700;font-size:1rem;white-space:nowrap}

.gal{position:relative;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,11rem);gap:1rem}
html.page .gal{grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));grid-template-rows:none;grid-auto-rows:auto}
.ph{position:relative;display:block;border:0;padding:0;border-radius:1rem;overflow:hidden;background:#e9e2d2 center/cover no-repeat;color:#fff;cursor:pointer;text-align:left;font:inherit;box-shadow:0 .15rem .6rem rgba(0,0,0,.1)}
html.page .ph{aspect-ratio:4/3}
.ph:hover,.ph:focus{outline:.2rem solid var(--gold2);outline-offset:.15rem}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:1.6rem .8rem .65rem;background:linear-gradient(transparent,rgba(10,20,35,.85));font-size:.95rem;line-height:1.3}
.ph .cap b{display:block;font-weight:700}
.ph .more{position:absolute;inset:0;background:rgba(27,54,93,.75);display:flex;align-items:center;justify-content:center;font:700 1.5rem 'Libre Baskerville',Georgia,serif}
.gal.empty .ph{filter:grayscale(1) brightness(.72);cursor:default;outline:none}
.gal .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.gal .msg div{background:rgba(255,255,255,.97);border-radius:1rem;padding:1.4rem 2rem;text-align:center;box-shadow:0 .6rem 2rem rgba(0,0,0,.3);max-width:36rem}
.gal .msg b{display:block;font:700 1.4rem/1.3 'Libre Baskerville',Georgia,serif;color:var(--navy);margin-bottom:.35rem}
.gal .msg span{display:block;color:var(--muted);font-size:1.05rem;margin-bottom:1rem}
html.page .gal.empty{grid-auto-rows:11rem}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:2.2rem 0 .9rem}
.sec h3{margin:0;font:700 1.6rem 'Libre Baskerville',Georgia,serif;color:var(--navy)}
.sec span{color:var(--muted);font-size:1rem}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem}
.cat{display:flex;flex-direction:column;background:#fff;border:.08rem solid var(--line);border-radius:1rem;overflow:hidden;text-decoration:none;color:var(--ink);box-shadow:0 .15rem .6rem rgba(27,54,93,.07);transition:transform .15s,box-shadow .15s}
.cat:hover,.cat:focus{transform:translateY(-.15rem);box-shadow:0 .6rem 1.4rem rgba(27,54,93,.16);outline:none}
.cat .im{height:9.5rem;background:center/cover no-repeat;filter:sepia(.2)}
.cat .tx{padding:.9rem 1.1rem 1rem}
.cat h4{margin:0 0 .25rem;font:700 1.2rem 'Libre Baskerville',Georgia,serif;color:var(--navy)}
.cat p{margin:0;color:var(--muted);font-size:.98rem}
.cat .go{margin-top:.45rem;font-weight:700;color:#8a6a2c;font-size:.98rem}

.share{display:flex;align-items:center;gap:1.4rem;margin-top:2rem;padding:1.3rem 1.6rem;background:var(--cream);border-radius:1rem;border-left:.45rem solid var(--gold)}
.share .ic{flex:none;width:3.6rem;height:3.6rem;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.share h3{margin:0 0 .2rem;font:700 1.3rem/1.25 'Libre Baskerville',Georgia,serif;color:var(--navy)}
.share p{margin:0;color:var(--muted);font-size:1rem}
.share .btns{margin-left:auto;display:flex;gap:.8rem;flex:none}

/* big view */
.box{position:fixed;inset:0;background:rgba(12,20,32,.94);display:none;align-items:center;justify-content:center;z-index:10;padding:1rem 4.5rem}
.box.on{display:flex}
.inner{display:flex;gap:1.6rem;align-items:center;max-width:100%;max-height:100%}
.inner img{max-width:min(60vw,52rem);max-height:86vh;border-radius:.6rem;background:#222}
.txt{color:#f3efe6;max-width:22rem;line-height:1.55;font-size:1.1rem}
.txt b{display:block;font:700 1.35rem/1.3 'Libre Baskerville',Georgia,serif;color:#fff;margin-bottom:.4rem}
.txt .m{color:var(--gold2);font-weight:600;margin-bottom:.6rem}
.txt .f{margin-top:.8rem;font-style:italic;color:#d8d2c4}
.x{position:fixed;top:.8rem;right:.8rem;background:#fff;color:var(--navy);border:0;border-radius:999px;padding:.7rem 1.3rem;font:700 1.1rem Lora,Georgia,serif;cursor:pointer}
.nv{position:fixed;top:50%;transform:translateY(-50%);width:3.4rem;height:3.4rem;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--navy);font-size:2.2rem;line-height:3.4rem;padding:0;cursor:pointer}
.nv.p{left:.7rem}.nv.n{right:.7rem}

@media(max-width:760px){
 html.page{font-size:17px}
 html.page .top h1{font-size:2rem}
 html.page .head{flex-direction:column;align-items:flex-start}
 html.page .head h2{font-size:1.7rem}
 html.page .gal{grid-template-columns:1fr 1fr;gap:.7rem}
 html.page .gal .msg div{padding:1rem}
 html.page .cats{grid-template-columns:1fr}
 html.page .sec{flex-direction:column;gap:.2rem}
 html.page .share{flex-direction:column;text-align:center;border-left:0;border-top:.4rem solid var(--gold)}
 html.page .share .btns{margin:0;flex-direction:column;width:100%}
 .box{padding:4rem .6rem 1rem;align-items:flex-start;overflow:auto}
 .inner{flex-direction:column;gap:1rem}
 .inner img{max-width:100%;max-height:60vh}
 .txt{max-width:100%}
 .nv{top:auto;bottom:1rem;transform:none}
}

/* compact (phones, inside Google Sites) */
#mini{display:none}
html.compact #full{display:none}
html.compact #mini{display:flex}
#mini{height:100vh;flex-direction:column;justify-content:center;gap:.6rem;padding:.4rem .2rem}
.m-title{font:700 1.35rem/1.2 'Libre Baskerville',Georgia,serif;color:var(--navy)}
.m-title small{display:block;font:400 .95rem Lora,Georgia,serif;color:var(--muted);margin-top:.15rem}
.m-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem;height:4.6rem}
.m-strip div{border-radius:.5rem;background:#e9e2d2 center/cover no-repeat}
.m-strip.empty div{filter:grayscale(1) brightness(.8)}
.m-btns{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.m-btns a{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;font-weight:700;font-size:1.05rem;border-radius:.8rem;padding:.6rem;min-height:3rem;line-height:1.2}
.m-btns a.a{background:var(--navy);color:#fff}
.m-btns a.b{background:#fff;color:var(--navy);border:.12rem solid var(--navy)}
</style></head><body>
<script>
var API = "https://script.google.com/macros/s/AKfycbzhLYzjtKO_nrwsk3J_qXKdL0ngMO3_I6rHPRe4lxHibzdpIAncmMio2-mH4MjWIkdaGg/exec";
function load(prep, main) {
  var ld = document.createElement('div');
  ld.textContent = 'Loading…';
  ld.style.cssText = 'position:fixed;right:12px;bottom:8px;z-index:9999;font:italic 14px Lora,Georgia,serif;color:#5f5b53';
  setTimeout(function () { if (!ld.done) document.body.appendChild(ld); }, 400);
  // Two sources, fetched together: data.json on GitHub Pages (fast, refreshed every few hours) and the
  // Apps Script web app (live from the Sheet, slower). Whichever answers first is drawn; when the live copy
  // then arrives with newer families or photos, the page redraws itself.
  // If data.json had to be used and the live copy arrives later with different families or photos,
  // the widget is drawn again from the live copy (the page is put back as it was first, then redrawn).
  var used = false, cached = null, live = null, timer = null, shown = null, shell = null;
  function key(d) { return JSON.stringify([d && d.families, d && d.photos, d && d.towns]); }
  function draw(d) {
    if (shell === null) shell = document.body.innerHTML; else document.body.innerHTML = shell;
    shown = d; main(prep ? prep(d) : d);
  }
  function use(d) {
    if (used) return; used = true; clearTimeout(timer);
    ld.done = true; if (ld.parentNode) ld.remove();
    draw(d);
  }
  function gotLive(d) {
    live = d;
    if (!used) use(d); else if (shown !== d && key(d) !== key(shown)) { try { draw(d); } catch (e) {} }
  }
  function getJson(src) {
    return fetch(src, { credentials: 'omit' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  getJson(API + '?page=data').then(gotLive).catch(function () {
    setTimeout(function () {   // one more try: the web app sometimes needs a moment to wake up
      getJson(API + '?page=data').then(gotLive).catch(function () { live = false; if (cached) use(cached); else if (!used) timer = setTimeout(fail, 4000); });
    }, 1500);
  });
  getJson('data.json?v=' + Math.floor(Date.now() / 300000)).then(function (d) {
    cached = d;
    // Show the cached copy straight away (the page then redraws itself if the live copy differs).
    use(d);
  }).catch(function () { if (live === false) fail(); else timer = setTimeout(function () { if (!used) { if (live) use(live); else fail(); } }, 12000); });
  function fail() {
    if (used) return; used = true;
    ld.done = true; if (ld.parentNode) ld.remove();
    var p = document.createElement('p');
    p.style.cssText = 'font:16px Lora,Georgia,serif;color:#5f5b53;padding:12px';
    p.innerHTML = 'Sorry, this could not be loaded just now. <a href="" target="_self" onclick="location.reload();return false">Try again</a>.';
    document.body.appendChild(p);
  }
}
</script>

<div id="full"></div><div id="mini"></div>
<div class="box" id="box"><button class="x" id="x">&times; Close</button><button class="nv p" id="bp" aria-label="Previous photo">&#8249;</button>
<div class="inner"><img id="big" alt=""><div class="txt" id="txt"></div></div><button class="nv n" id="bn" aria-label="Next photo">&#8250;</button></div>
<script>
/* Shared by the page widgets (town, family, families, stories...).
   Google Sites keeps an embed's height in proportion to its width (a phone gets a much shorter frame),
   so inside Sites everything is sized from the frame width:
     wide    framed, 860px or wider: the whole design scales with the width (1rem = width / 72)
     compact framed, narrower (phones): a short summary card with big buttons that open the full page
     page    opened on its own (new tab): an ordinary responsive page with a header and a Back button
   Navigation: Google Sites sandboxes embeds with no allow-top-navigation, so from INSIDE a Sites page every
   link must open a new tab. Once a widget is open on its own (page mode) links between widgets stay in the
   same tab, so the browser Back button works. Links back to the Google Site open in the same tab too. */
var FRAMED = (function () { try { return window.top !== window; } catch (e) { return true; } })();
function frameMode() {
  var W = window.innerWidth, root = document.documentElement, mode = !FRAMED ? 'page' : (W < 860 ? 'compact' : 'wide');
  root.classList.remove('page', 'compact', 'wide'); root.classList.add(mode);
  root.style.fontSize = mode === 'wide' ? (W / 72) + 'px' : mode === 'compact' ? Math.min(W / 24, 22) + 'px' : '';
  var b = document.querySelector('base'); if (b) b.target = FRAMED ? '_blank' : '_self';
  return mode;
}
var MODE = frameMode();
var lastW = window.innerWidth;
window.addEventListener('resize', function () {
  if (Math.abs(window.innerWidth - lastW) < 2) return;
  lastW = window.innerWidth;
  var m = MODE; MODE = frameMode(); if (m !== MODE && window.render) window.render();
});
var norm = function (s) { return String(s || '').toLowerCase().replace(/[^a-z]/g, ''); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var img = function (id, w) { return 'https://lh3.googleusercontent.com/d/' + id + '=w' + (w || 800); };
/* Page header with a Back button. backTo = where to go when there is nothing to go back to. */
function pageTop(title, backTo) {
  var site = (typeof SITE !== 'undefined' && SITE) || (window.DATA && window.DATA.site) || 'https://sites.google.com/view/greeksoftheriverland/';
  return '<div class="top"><a class="site" href="' + esc(site) + '">Greeks of the Riverland</a>' + (title ? '<h1>' + title + '</h1>' : '') +
    '<button class="back" type="button" data-back="' + esc(backTo || site) + '">&larr; Back</button></div>';
}
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('button[data-back]'); if (!b) return;
  var ref = document.referrer || '';
  if (history.length > 1 && ref && /josephsismart\.github\.io/.test(ref)) history.back(); else location.href = b.getAttribute('data-back');
});

function main(DATA){
var SITE = window.SITE = String(DATA.site || '').replace(/\/?$/, '/');
var M = '../public/m/';
var ARCH = [M + 'arch-family-community.jpg', M + 'arch-work-everyday.jpg', M + 'arch-school-sporting.jpg', M + 'arch-vineyard.jpg', M + 'arch-wedding.jpg', M + 'arch-shed.jpg', M + 'intro-1950s.jpg', M + 'h-stories.jpg'];
var CATS = [
  { t: 'Family & Community', s: 'Weddings, christenings, church and celebrations', im: M + 'arch-family-community.jpg' },
  { t: 'School & Sporting Life', s: 'School days, soccer clubs and Greek school', im: M + 'arch-school-sporting.jpg' },
  { t: 'Work & Everyday Life', s: 'Fruit blocks, packing sheds, shops and homes', im: M + 'arch-work-everyday.jpg' }
];
var photos = (DATA.photos || []).slice();
var selfUrl = 'stories.html';
var backUrl = SITE + 'stories-photos';
var CAM = '<svg width="55%" height="55%" viewBox="0 0 24 24" fill="none" stroke="#1b365d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
function who(p) { return p.people || (p.family + ' family'); }
function when(p) { return [p.year, p.place].filter(Boolean).join(' · '); }

function full() {
  var page = MODE === 'page', n = photos.length, h = '';
  h += pageTop('Stories &amp; Photos', backUrl);
  h += '<div class="head"><div><div class="eyebrow">Memories of our community</div><h2>Shared photographs</h2>' +
       '<p>' + (n ? 'Tap a photo to see it bigger, with who is in it and when it was taken.' : 'Old family photos, shared by the families themselves.') + '</p></div>' +
       '<div class="r"><span class="count">' + (n ? n + (n === 1 ? ' photo' : ' photos') : 'Coming soon') + '</span><a class="btn navy" href="upload.html">+ Share a photo</a></div></div>';
  if (!n) {
    h += '<div class="gal empty">' + ARCH.map(function (s) { return '<div class="ph" style="background-image:url(\'' + s + '\')"></div>'; }).join('') +
         '<div class="msg"><div><b>Shared photographs will appear here</b><span>Do you have old photos of family, work, church or sport? We would love to see them.</span>' +
         '<a class="btn navy" href="upload.html">Share a photo</a></div></div></div>';
  } else {
    var show = page ? photos : photos.slice(0, 8);
    h += '<div class="gal">' + show.map(function (p, i) {
      var more = !page && i === 7 && n > 8 ? '<div class="more">+' + (n - 7) + ' more</div>' : '';
      return '<button class="ph" data-i="' + i + '" style="background-image:url(\'' + img(p.id, 700) + '\')"><div class="cap"><b>' + esc(who(p)) + '</b>' + esc(when(p)) + '</div>' + more + '</button>';
    }).join('') + '</div>';
  }
  h += '<div class="sec"><h3>From the archive</h3><span>Three themes from Riverland Greek life</span></div>';
  h += '<div class="cats">' + CATS.map(function (c) {
    return '<a class="cat" href="upload.html"><div class="im" style="background-image:url(\'' + c.im + '\')"></div><div class="tx"><h4>' + esc(c.t) + '</h4><p>' + esc(c.s) + '</p><div class="go">Coming soon &middot; share yours &rarr;</div></div></a>';
  }).join('') + '</div>';
  h += '<div class="share"><div class="ic">' + CAM + '</div><div><h3>Have a story or photo to share?</h3>' +
       '<p>Tell us who is in it, roughly when and where, and what was happening.</p></div>' +
       '<div class="btns"><a class="btn navy" href="upload.html">Send photos</a><a class="btn line" href="family.html">Add your family</a></div></div>';
  return h;
}
function mini() {
  var n = photos.length, ims = photos.slice(0, 4).map(function (p) { return img(p.id, 300); });
  return '<div class="m-title">Shared photographs<small>' + (n ? n + (n === 1 ? ' photo' : ' photos') + ' shared so far' : 'Photos coming soon &mdash; share yours') + '</small></div>' +
    '<div class="m-strip' + (n ? '' : ' empty') + '">' + ims.concat(ARCH).slice(0, 4).map(function (s) { return '<div style="background-image:url(\'' + s + '\')"></div>'; }).join('') + '</div>' +
    '<div class="m-btns"><a class="a" href="' + selfUrl + '">' + (n ? 'See the photos' : 'Open the page') + ' &rsaquo;</a><a class="b" href="upload.html">Share a photo</a></div>';
}
var box = document.getElementById('box'), cur = 0;
function openBig(i) {
  cur = (i + photos.length) % photos.length; var p = photos[cur];
  document.getElementById('big').src = img(p.id, 1600);
  document.getElementById('txt').innerHTML = '<b>' + esc(who(p)) + '</b>' + (when(p) ? '<div class="m">' + esc(when(p)) + '</div>' : '') +
    (p.about ? '<div>' + esc(p.about) + '</div>' : '') + '<div class="f">' + esc(p.family) + ' family' + (p.town ? ', ' + esc(p.town) : '') + '</div>';
  box.classList.add('on');
}
document.addEventListener('click', function (e) { var c = e.target.closest && e.target.closest('button.ph'); if (c) openBig(+c.dataset.i); });
document.getElementById('x').onclick = function () { box.classList.remove('on'); };
document.getElementById('bp').onclick = function () { openBig(cur - 1); };
document.getElementById('bn').onclick = function () { openBig(cur + 1); };
box.addEventListener('click', function (e) { if (e.target === box) box.classList.remove('on'); });
document.addEventListener('keydown', function (e) {
  if (!box.classList.contains('on')) return;
  if (e.key === 'Escape') box.classList.remove('on'); if (e.key === 'ArrowLeft') openBig(cur - 1); if (e.key === 'ArrowRight') openBig(cur + 1);
});
window.render = function () {
  document.title = 'Stories & Photos — Greeks of the Riverland';
  document.getElementById('full').innerHTML = MODE === 'compact' ? '' : full();
  document.getElementById('mini').innerHTML = MODE === 'compact' ? mini() : '';
};
render();
}
load(null, main);
</script></body></html>
